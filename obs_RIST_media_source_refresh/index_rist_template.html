<!DOCTYPE html>
<html lang="en">
<head>
<title>RTT and Bitrate</title>
<meta charset="UTF-8">
<style type="text/css">
  h1 {
	color: #fff;
	text-shadow: 0 0 3px #000, 0 0 5px #000;
  }
</style>
</head>
<body>

<h1 id="output"></h1>
<script type="text/javascript" src="config.js"></script>
<script type="text/javascript">
const host = config.host;
const port = config.port;
const mediaSourceName = config.mediaSourceName;
const REFRESH_COOLDOWN_MS = config.refreshCooldownMs;
const statsUrl = "http://"+config.statsUrl+"/stats";

console.log(host, port, mediaSourceName, REFRESH_COOLDOWN_MS, statsUrl);

let obs = null;
let currentSettings = null;
let isRefreshing = false;
let allScenes = [];
let currentSearchIndex = 0;
let lastRefreshTime = 0;
if(config.enableStatsOverlay)
{
	setInterval(function() {
		fetch(statsUrl)
			.then(response => response.json())
			.then(data => {
				if (typeof data["receiver-stats"] === "undefined" || data["receiver-stats"] == null) {
					document.getElementById('output').textContent = "";
				} else {
					let brValue = 0;
					let rttValue = 0;
					let peers_counter = 0;
					let dead_peers = 0;
					data["receiver-stats"].flowinstant.peers.forEach((peer) => {
						if (peer.stats.bitrate !== undefined) {
							brValue += Math.round(peer.stats.bitrate / 1024);
						}
						if (peer.stats.rtt !== undefined) {
							rttValue = Math.round(peer.stats.rtt);
						}
						if(peer.dead !== undefined)
						{
							if(peer.dead == 1)
							{
								dead_peers++;
							}
						}
						peers_counter++;
					});
					if(peers_counter == dead_peers)
					{
						document.getElementById('output').textContent = "";
						connectAndRefresh();
					}
					else
					{
						document.getElementById('output').textContent = `bitrate: ${brValue} rtt: ${rttValue}`;
					}
				}
			})
			.catch(error => {
				console.error('Error fetching stats:', error);
			});
	}, 1000);
}
//OBS METHODS
function triggerRefresh() {
	const now = Date.now();
	const timeSinceLastRefresh = now - lastRefreshTime;
	
	if (isRefreshing) {
		console.log('Refresh already in progress...');
		return;
	}
	
	if (timeSinceLastRefresh < REFRESH_COOLDOWN_MS) {
		const remainingTime = Math.ceil((REFRESH_COOLDOWN_MS - timeSinceLastRefresh) / 1000);
		console.log(`Please wait ${remainingTime} more seconds before refreshing again`);
		updateStatus(`Please wait ${remainingTime}s...`);
		return;
	}
	
	connectAndRefresh();
}

function connectAndRefresh() {
	isRefreshing = true;
	currentSearchIndex = 0;
	console.log('Connecting to OBS...');
	updateStatus('Connecting to OBS...');
	
	if (obs && obs.readyState === WebSocket.OPEN) {
		obs.close();
	}
	
	obs = new WebSocket(`ws://${host}:${port}`);
	
	obs.onopen = function() {
		console.log('Connected to OBS WebSocket');
		updateStatus('Connected, identifying...');
		
		const identifyMessage = {
			"op": 1,
			"d": {
				"rpcVersion": 1,
				"eventSubscriptions": 0
			}
		};
		
		console.log('Sending identify (no auth)...');
		obs.send(JSON.stringify(identifyMessage));
	};
	
	obs.onmessage = function(event) {
		const data = JSON.parse(event.data);
		console.log('Received:', data.op);
		
		if (data.op === 2) {
			console.log('Identification successful!');
			updateStatus('Identified, getting all scenes...');
			getAllScenes();
		} else if (data.op === 7) {
			handleRequestResponse(data);
		}
	};
	
	obs.onerror = function(error) {
		console.error('WebSocket error:', error);
		updateStatus('Connection error');
		resetRefreshState();
	};
	
	obs.onclose = function(event) {
		console.log('Connection closed:', event.code, event.reason);
		resetRefreshState();
	};
}

function resetRefreshState() {
	isRefreshing = false;
	currentSearchIndex = 0;
	updateStatus('Ready - Click to refresh media source');
}

function getAllScenes() {
	console.log('Getting all scenes...');
	updateStatus('Getting all scenes...');
	
	obs.send(JSON.stringify({
		"op": 6,
		"d": {
			"requestType": "GetSceneList",
			"requestId": "getAllScenes"
		}
	}));
}

function searchAllScenesForMediaSource() {
	console.log(`Searching ${allScenes.length} scenes for "${mediaSourceName}"`);
	updateStatus(`Searching ${allScenes.length} scenes...`);
	searchNextScene();
}

function searchNextScene() {
	if (currentSearchIndex >= allScenes.length) {
		console.log(`"${mediaSourceName}" not found in any scene`);
		updateStatus('Media source not found in any scene');
		setTimeout(() => {
			if (obs) obs.close();
		}, 3000);
		return;
	}

	const scene = allScenes[currentSearchIndex];
	console.log(`Searching scene ${currentSearchIndex + 1}/${allScenes.length}: "${scene.sceneName}"`);
	updateStatus(`Searching scene: ${scene.sceneName}...`);
	
	obs.send(JSON.stringify({
		"op": 6,
		"d": {
			"requestType": "GetSceneItemList",
			"requestId": `searchScene_${currentSearchIndex}`,
			"requestData": {
				"sceneName": scene.sceneName
			}
		}
	}));
}

function getCurrentSettings() {
	console.log(`Getting settings for "${mediaSourceName}"`);
	updateStatus('Getting media source settings...');
	
	obs.send(JSON.stringify({
		"op": 6,
		"d": {
			"requestType": "GetInputSettings",
			"requestId": "getCurrentSettings",
			"requestData": {
				"inputName": mediaSourceName
			}
		}
	}));
}

function refreshMediaSource() {
	console.log('Refreshing media source...');
	updateStatus('Refreshing media source...');
	
	obs.send(JSON.stringify({
		"op": 6,
		"d": {
			"requestType": "SetInputSettings",
			"requestId": "refreshMediaSource",
			"requestData": {
				"inputName": mediaSourceName,
				"inputSettings": currentSettings
			}
		}
	}));
}

function handleRequestResponse(data) {
	const requestType = data.d.requestType;
	const requestId = data.d.requestId;
	
	console.log(`Received response for: ${requestType}`);
	
	switch (requestType) {
		case 'GetSceneList':
			if (requestId === 'getAllScenes') {
				allScenes = data.d.responseData.scenes;
				console.log(`Found ${allScenes.length} scenes`);
				searchAllScenesForMediaSource();
			}
			break;
			
		case 'GetSceneItemList':
			if (requestId.startsWith('searchScene_')) {
				const sceneIndex = parseInt(requestId.split('_')[1]);
				const sceneItems = data.d.responseData.sceneItems;
				const mediaSourceExists = sceneItems.some(item => 
					item.sourceName === mediaSourceName
				);
				
				if (mediaSourceExists) {
					const sceneName = allScenes[sceneIndex].sceneName;
					console.log(`Found "${mediaSourceName}" in scene "${sceneName}"`);
					updateStatus(`Found in ${sceneName}, getting settings...`);
					getCurrentSettings();
				} else {
					currentSearchIndex++;
					searchNextScene();
				}
			}
			break;
			
		case 'GetInputSettings':
			if (requestId === 'getCurrentSettings') {
				currentSettings = data.d.responseData.inputSettings;
				console.log('Got settings, refreshing...');
				refreshMediaSource();
			}
			break;
			
		case 'SetInputSettings':
			if (requestId === 'refreshMediaSource') {
				console.log('Media source refreshed successfully!');
				updateStatus('Media source refreshed successfully!');
				lastRefreshTime = Date.now();
				setTimeout(() => {
					if (obs) obs.close();
				}, 2000);
			}
			break;
	}
}

function updateStatus(message) {
	const statusEl = document.getElementById('status');
	if (statusEl) {
		statusEl.textContent = message;
	}
	console.log('Status:', message);
}

window.triggerRefresh = triggerRefresh;

console.log('OBS Media Refresher loaded. Call triggerRefresh() to start.');
updateStatus('Ready - Click to refresh media source');
</script>
</body>
</html>
